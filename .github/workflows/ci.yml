name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Intel/x64 and ARM runners for each operating system.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - run: go test ./...
      - name: build
        shell: bash
        run: |
          go build -o drl-test$([ "$RUNNER_OS" = Windows ] && echo .exe) ./cmd/disk-recovery-lab
          ./drl-test --version
      - name: end-to-end smoke test (real binary, real drive listing)
        shell: bash
        run: scripts/smoke.sh ./drl-test$([ "$RUNNER_OS" = Windows ] && echo .exe)
