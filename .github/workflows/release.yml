name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # macOS is needed for the universal .app (lipo + codesign); the Windows and
    # Linux files are cross-compiled on the same runner.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build all platforms
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/build.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: true
